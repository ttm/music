name: Docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the package and its docs extras
        # The SSTIM extra too: the SSTIM page's reference imports
        # music.stimulation.sstim, which imports RDFLib. And what the
        # Listen page's sounds need, since the build renders them: sympy
        # for the peal, and espeak-ng and Praat for the singing.
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak-ng
          python -m pip install --upgrade pip
          pip install -e '.[docs,sstim,structures,singing]'

      # -W turns Sphinx warnings into errors: a malformed docstring fails the
      # build rather than quietly rendering wrong. MUSIC_DOCS_SOUNDS=strict
      # does the same for a Listen page sound that could not be rendered,
      # which a local build only reports.
      - name: Build
        env:
          MUSIC_DOCS_SOUNDS: strict
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          # Preserve Sphinx's hidden output files, as the previous action did.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
