name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,antialias,sstim]'

      - name: Lint
        run: ruff check music tests examples tools conftest.py

      - name: Extended lint inventory (informational, Python 3.12)
        if: matrix.python-version == '3.12'
        run: ruff check --select ALL --statistics music || true

      - name: Type check
        run: mypy music

      - name: Test
        # --cov-branch, because 100% of lines is not 100% of branches:
        # the gate read 100 while twelve conditions had only ever gone
        # one way, and three defects were sitting in them.
        env:
          SSTIM_LIVE: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: pytest -q --cov=music --cov-branch --cov-report=term-missing --cov-fail-under=100

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the package
        # The plot extra: PrimaryTables.draw_tables() needs matplotlib.
        # The singing extra and espeak-ng: singing_demo.py sings. An
        # example that reaches for either should fail here for a real
        # reason rather than for a missing optional dependency.
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          pip install -e '.[plot,singing,antialias,sstim]'
      - name: Check ASSESSMENT.md against the package
        # The figures an AST scan can settle, which is most of them and
        # costs nothing. The ones needing pytest and ruff are checked by
        # the release gate, which is when the file is published.
        run: python tools/assessment_figures.py --fast

      - name: Run every example
        # Nothing ran these until now, and it showed: deferring the
        # music.structures import broke three of them, and the break
        # survived the full suite at 100% coverage, mypy, ruff and the
        # docs build. Every one of those checks looks at the package;
        # the examples are the only callers this repository has.
        run: python tools/run_examples.py

      - name: Publish diagnostic high-rate DSP comparison
        # Not a perceptual outcome or a timing gate: timings vary by runner.
        run: >-
          python tools/benchmark_dynamic_aliasing.py --repeats 2
          --json dynamic-alias-report.json > dynamic-alias-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: dynamic-alias-report
          path: |
            dynamic-alias-report.json
            dynamic-alias-report.md

  singing:
    name: Singing, with both backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install what the singers run
        # eCantorix is Perl driving espeak, with abc2midi and sox; the
        # psola backend needs espeak-ng. Both are measured, not stubbed,
        # in tests/test_singing_engine.py, which skips everywhere else.
        # Math::FFT is not packaged for Ubuntu, so it comes from CPAN, as
        # it does in eCantorix's own CI.
        run: |
          sudo apt-get update
          sudo apt-get install --yes espeak espeak-ng sox abcmidi flite \
              bc libmidi-perl liburi-perl cpanminus
          sudo cpanm --notest Math::FFT
      - name: Install the package and its singing extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,singing]'
      - name: Clone the pinned engine
        run: python -c "import music.singing as s; print(s.setup_engine())"
      - name: Sing, and measure it
        # The engine tests, the timing experiment's, which hold its
        # vibrato variant to the package's singer sample for sample, and
        # the tutorial, whose singing blocks the test jobs leave out.
        run: >-
          pytest -v tests/test_singing_engine.py tests/test_singing_timing.py
          tests/test_tutorial.py
      - name: Compare the backends
        run: python tools/compare_singing.py --out singing-comparison
      - name: Sing the examples that compare the backends
        # The examples job has no eCantorix, so there these sing with the
        # psola backend alone; here both sing, a file each.
        run: |
          mkdir singing-examples
          cd singing-examples
          python ../examples/singing_backends.py
          python ../examples/singing_effects.py
      - uses: actions/upload-artifact@v7
        with:
          name: singing-comparison
          path: |
            singing-comparison
            singing-examples

  wheel:
    name: Installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows expands dist/*.whl just as on Linux/macOS.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build the wheel
        run: python -m build --wheel
      - name: Install the wheel and its runtime dependencies
        run: python -m pip install dist/*.whl
      - name: Check the installed wheel outside the checkout
        run: python tools/check_wheel.py --wheel dist/*.whl

  minimums:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install the exact lower bounds pyproject declares
        # pyproject says numpy >= 1.26.4 and so on. Nothing tested that
        # claim: every other job resolves to the newest release, so the
        # floors could drift into fiction without a single failure.
        run: |
          python -m pip install --upgrade pip
          pip install 'colorama==0.4.6' 'numpy==1.26.4' 'soundfile==0.12.1' \
                      'sympy==1.12' 'termcolor==2.4.0' 'matplotlib==3.7.1'
          pip install pytest pytest-cov scipy sstim
          pip install --no-deps -e .
      - name: Test
        run: pytest -q
