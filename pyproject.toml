[project]
name = 'music'
version = '1.5.0'
authors = [
    { name = 'Renato Fabbri', email = 'renato.fabbri@gmail.com' },
    { name = 'Jacopo Donati', email = 'jacopo.donati@gmail.com' }
]
description = 'Extreme-fidelity synthesis of musical elements, based on the MASS framework'
license = { file = "LICENSE" }
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
    'colorama >= 0.4.6',
    'numpy >= 1.26.4',
    'soundfile >= 0.12.1',
    'sympy >= 1.12',
    'termcolor >= 2.4.0',
]
optional-dependencies = { plot = [
    'matplotlib >= 3.7.1',
], dev = [
    'pytest >= 8.2',
    'pytest-cov >= 5.0',
    'mypy >= 2.0',
    'ruff >= 0.14',
], docs = [
    'sphinx >= 8.0',
    'numpydoc >= 1.8',
    'furo >= 2024.1.29',
] }
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Typing :: Typed',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Healthcare Industry',
    'Intended Audience :: Telecommunications Industry',
    'Intended Audience :: Developers',
    'Intended Audience :: Education',
    'Intended Audience :: Religion',
    'Topic :: Scientific/Engineering :: Physics',
    'Topic :: Scientific/Engineering :: Visualization',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Topic :: Multimedia :: Sound/Audio :: Sound Synthesis',
    'Topic :: Multimedia :: Sound/Audio :: Editors',
    'Topic :: Multimedia :: Sound/Audio :: Mixers',
    'Topic :: Multimedia :: Sound/Audio :: Speech',
    'Topic :: Artistic Software',
]
keywords = [
    'acoustics',
    'AM',
    'art',
    'audio',
    'binaural beats',
    'campanology',
    'change ringing',
    'entrainment',
    'filter',
    'FM',
    'isochronic tones',
    'LUT',
    'MASS',
    'multimedia',
    'music',
    'noise',
    'PCM',
    'permutation',
    'physics',
    'psychophysics',
    'sensory stimulation',
    'signal processing',
    'sing',
    'sound',
    'spatialization',
    'speech',
    'SSTIM',
    'synth'
]

[project.urls]
Homepage = 'https://ttm.github.io/music/'
Documentation = 'https://ttm.github.io/music/'
Tutorial = 'https://ttm.github.io/music/tutorial.html'
Source = 'https://github.com/ttm/music'
Changelog = 'https://github.com/ttm/music/blob/master/CHANGELOG.md'
Issues = 'https://github.com/ttm/music/issues'
Funding = 'https://github.com/sponsors/ttm'

[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[tool.setuptools.package-data]
music = ['py.typed']

[tool.ruff]
line-length = 79
extend-exclude = ['music/singing/ecantorix']

[tool.ruff.lint]
select = ['E', 'W', 'F']

[tool.mypy]
# Deliberately no python_version: mypy then targets the interpreter it runs
# under, which is what the CI matrix needs. Pinning it to 3.11 made mypy
# fail to parse numpy's own stubs when run on 3.12+.
files = ['music']
ignore_missing_imports = true
# Most of this package is unannotated, and without this mypy skips those
# function bodies entirely -- it was reporting success while inspecting
# about a sixth of the code.
check_untyped_defs = true
